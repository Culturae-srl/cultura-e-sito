<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaggio inviato — Cultura è...</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/logos/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .grazie-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--near-black);
      padding: 40px 24px;
      text-align: center;
    }
    .grazie-box {
      max-width: 520px;
    }
    .grazie-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }
    .grazie-icon svg {
      width: 36px;
      height: 36px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .grazie-box h1 {
      font-size: 36px;
      color: var(--white);
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    .grazie-box h1 .accent { color: var(--red); }
    .grazie-box p {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      line-height: 1.7;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <div class="grazie-wrap">
    <div class="grazie-box">
      <div class="grazie-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1>Messaggio <span class="accent">ricevuto!</span></h1>
      <p>Grazie per averci contattato.<br>Ti risponderemo entro 48 ore.</p>
      <a href="index.html" class="btn-primary">Torna alla Home</a>
    </div>
  </div>
</body>
</html>
